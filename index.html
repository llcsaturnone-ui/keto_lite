<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Дневник питания</title><style>:root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #f4f4f5; font-synthesis: none; --green: #34d399; --surface: #18181b; --field: #27272a; --border: #303035; --muted: #a1a1aa; }

footer { padding: 3px 6px 10px; text-align: center; color: #858590; font-size: 10px; line-height: 1.6; }

.notifications { position: fixed; z-index: 20; width: min(calc(100% - 32px),440px); bottom: max(20px,env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); pointer-events: none; display: flex; flex-direction: column; gap: 8px; }

.app-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 16px 18px 0; padding: 4px; background: #18181b; border: 1px solid #303035; border-radius: 15px; }
